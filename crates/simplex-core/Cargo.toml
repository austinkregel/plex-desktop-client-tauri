[package]
name = "simplex-core"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic core library for the Simplex media client"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "2.3"
dirs = "5"
url = "2.5"
urlencoding = "2.1"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }
open = "5"
rand = "0.8"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
