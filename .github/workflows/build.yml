name: GTK Build And Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test simplex-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p simplex-core

  build-linux:
    name: Build Linux x86_64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-vaapi \
            gstreamer1.0-libav

      - name: Build GTK app
        run: cargo build --release -p simplex-app

      - name: Package .deb
        run: |
          APP_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="simplex-app"))')
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications dist
          cp target/release/simplex pkg/usr/bin/
          cp simplex.desktop pkg/usr/share/applications/
          cat > pkg/DEBIAN/control <<CTRL
          Package: simplex
          Version: ${APP_VERSION}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: libgtk-4-1, libadwaita-1-0, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-vaapi, gstreamer1.0-libav
          Maintainer: Austin Kregel
          Description: Native media client for Plex servers
           Simplex is a GTK4 + GStreamer desktop client for browsing
           and playing media from Plex servers with hardware-accelerated
           video, PiP, and audio track change detection.
          CTRL
          dpkg-deb --build pkg "dist/simplex_${APP_VERSION}_amd64.deb"
          cp target/release/simplex "dist/simplex-linux-x86_64"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum simplex-linux-x86_64 *.deb > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplex-linux-x86_64
          path: dist/*

  build-windows:
    name: Build Windows x86_64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install GTK4 and GStreamer (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-pkg-config

      - name: Build GTK app
        shell: msys2 {0}
        run: |
          export PKG_CONFIG_PATH="/ucrt64/lib/pkgconfig:$PKG_CONFIG_PATH"
          cargo build --release -p simplex-app

      - name: Prepare distribution files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/simplex.exe dist/simplex-windows-x86_64.exe

      - name: Generate checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/simplex-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  simplex-windows-x86_64.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplex-windows-x86_64
          path: dist/*

  release:
    name: Create GitHub Release Assets
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            simplex-linux-x86_64/*
            simplex-windows-x86_64/*
          generate_release_notes: true
