name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-tauri:
    name: Build (${{ matrix.os }} / ${{ matrix.rust_target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - os: macos-13
            rust_target: x86_64-apple-darwin
          # macOS Apple Silicon
          - os: macos-14
            rust_target: aarch64-apple-darwin
          # Windows (MSVC)
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust (with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Show Rust targets
        run: rustup show

      - name: Install JS deps
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.rust_target }}





